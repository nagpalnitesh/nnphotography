# Build on Node 22, which Netlify Agent Runners need and package.json's
# engines range allows.
[build.environment]
  NODE_VERSION = "22"

# Serve the real XML sitemap with an XML content type.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# SPA fallback. force = false means existing files win, so /sitemap.xml,
# /robots.txt and the prerendered /gallery, /about-me and /contact-me pages
# (gallery.html etc., written by scripts/prerender-meta.mjs) are served as-is.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
